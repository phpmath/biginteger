name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5', '8.6' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring
          coverage: pcov
          tools: composer

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --colors=always --coverage-clover=coverage/clover.xml

      - name: Check that the coverage is 100%
        run: |
          php -r '$m = simplexml_load_file("coverage/clover.xml")->project->metrics; $covered = (int) $m["coveredstatements"]; $total = (int) $m["statements"]; if ($covered !== $total) { fwrite(STDERR, "Coverage is $covered of $total statements\n"); exit(1); }'

      - name: Upload code coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: phpunit-coverage-${{ matrix.php }}
          path: coverage/clover.xml
