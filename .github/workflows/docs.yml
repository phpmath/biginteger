name: Documentation

on:
  push:
    branches: [ master ]
    tags: [ '*.*.*', 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: phpmath/docs-builder/.github/workflows/docs.yml@master
    with:
      library: biginteger
